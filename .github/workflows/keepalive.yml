# Supabase pauses a free project after 7 days without database activity, which
# would break the offer form on this page. One query every three days counts as
# activity. The query returns nothing (row-level security allows inserts only),
# so it writes no data.
#
# The commit at the end is not decoration: GitHub disables scheduled workflows
# after 60 days of repository inactivity, so the job keeps its own schedule
# alive as well as the database.
name: Keep the offers database awake

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Query Supabase
        env:
          KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "https://vspltchsonlcnrmhxbik.supabase.co/rest/v1/domain_offers?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase answered $code"
          test "$code" = "200"

      - name: Record the ping
        run: |
          date -u +"Last keepalive: %Y-%m-%d %H:%M UTC" > last-keepalive.txt
          git config user.name "keepalive"
          git config user.email "noreply@firststepalarm.com"
          git add last-keepalive.txt
          git diff --quiet --cached || git commit -m "Keepalive ping"
          git push
